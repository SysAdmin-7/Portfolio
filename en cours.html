<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page en Construction | Portfolio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        /* --- 1. CSS (Le Style) --- */
        :root {
            --bg-color: #0f172a;       /* Fond sombre (Bleu nuit) */
            --accent-color: #3b82f6;   /* Bleu électrique */
            --text-color: #f1f5f9;     /* Blanc cassé */
            --glass-bg: rgba(255, 255, 255, 0.05); /* Effet verre */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            height: 100vh;
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% 50%, #1e293b 0%, #0f172a 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-color);
            overflow: hidden;
        }

        /* La carte centrale */
        .container {
            text-align: center;
            background: var(--glass-bg);
            padding: 3rem;
            border-radius: 20px;
            backdrop-filter: blur(10px); /* Flou d'arrière-plan */
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            max-width: 500px;
            width: 90%;
            animation: float 6s ease-in-out infinite;
        }

        /* L'icône animée (Engrenages) */
        .icon-box {
            font-size: 4rem;
            color: var(--accent-color);
            margin-bottom: 1.5rem;
            position: relative;
            display: inline-block;
        }

        .fa-gear {
            animation: spin 4s linear infinite;
        }

        /* Titre */
        h1 {
            font-size: 2rem;
            margin-bottom: 1rem;
            font-weight: 700;
        }

        /* Texte avec effet machine à écrire */
        #typing-text {
            font-size: 1.1rem;
            color: #94a3b8; /* Gris clair */
            min-height: 1.6em; /* Empêche le saut de ligne */
            margin-bottom: 2rem;
        }

        /* Barre de progression stylée */
        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 2rem;
        }

        .progress-fill {
            height: 100%;
            width: 50%;
            background: var(--accent-color);
            border-radius: 10px;
            animation: loading 2s ease-in-out infinite;
        }

        /* Bouton de retour */
        .btn-home {
            display: inline-block;
            padding: 12px 30px;
            background: var(--accent-color);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.5);
        }

        .btn-home:hover {
            background: #2563eb;
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.6);
        }

        /* --- ANIMATIONS (Keyframes) --- */
        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        @keyframes loading {
            0% { width: 0%; margin-left: 0; }
            50% { width: 70%; margin-left: 30%; }
            100% { width: 0%; margin-left: 100%; }
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon-box">
            <i class="fa-solid fa-gear"></i>
        </div>

        <h1>Travaux en cours</h1>

        <p id="typing-text"></p>

        <div class="progress-bar">
            <div class="progress-fill"></div>
        </div>

        <a href="index.html" class="btn-home">
            <i class="fa-solid fa-arrow-left"></i> Retour à l'accueil
        </a>
    </div>

    <script>
        /* --- 2. JAVASCRIPT (L'Animation du texte) --- */
        
        // Les phrases qui vont s'afficher tour à tour
        const phrases = [
            "Je suis en train de coder cette page...",
            "Mise en place du design...",
            "Correction des derniers bugs...",
            "Préparez-vous, ça arrive bientôt !"
        ];

        let currentPhraseIndex = 0;
        let charIndex = 0;
        let isDeleting = false;
        const typingSpeed = 100; // Vitesse d'écriture
        const deletingSpeed = 50; // Vitesse d'effacement
        const pauseTime = 1500; // Pause une fois la phrase écrite

        const typingElement = document.getElementById("typing-text");

        function typeEffect() {
            const currentPhrase = phrases[currentPhraseIndex];

            if (isDeleting) {
                // On efface
                typingElement.textContent = currentPhrase.substring(0, charIndex - 1);
                charIndex--;
            } else {
                // On écrit
                typingElement.textContent = currentPhrase.substring(0, charIndex + 1);
                charIndex++;
            }

            // Gestion de la vitesse et des états
            let typeSpeed = isDeleting ? deletingSpeed : typingSpeed;

            if (!isDeleting && charIndex === currentPhrase.length) {
                // Phrase terminée, on attend un peu
                typeSpeed = pauseTime;
                isDeleting = true;
            } else if (isDeleting && charIndex === 0) {
                // Effacement terminé, on passe à la phrase suivante
                isDeleting = false;
                currentPhraseIndex = (currentPhraseIndex + 1) % phrases.length;
            }

            setTimeout(typeEffect, typeSpeed);
        }

        // Lancer l'animation au chargement
        document.addEventListener('DOMContentLoaded', typeEffect);
    </script>

</body>
</html>
