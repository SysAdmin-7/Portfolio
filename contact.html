<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Contact</title>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
<link href="CSS/contact.css" rel="stylesheet">

</head>
<body>
    <div id="nav-container"></div>

    <div class="main-content">
        <div class="contact-wrapper">
            
            <div class="contact-info-panel">
                <h3>Mes Coordonnées</h3>
                <p class="intro-text">Un projet ? Une question ? N'hésitez pas à m'écrire, je vous répondrai dans les plus brefs délais.</p>
                
                <div class="info-item">
                    <i class="fa-solid fa-phone"></i>
                    <span>06 46 72 60 62</span>
                </div>
                <div class="info-item">
                    <i class="fa-solid fa-envelope"></i>
                    <span>mathisdubos15@gmail.com</span>
                </div>
                <div class="info-item">
                    <i class="fa-solid fa-location-dot"></i>
                    <span>Rosière-en-santerre, France</span>
                </div>

                <div class="social-links">
                    <a href="https://www.linkedin.com/in/mathis-dubos-0217a8385/"><i class="fa-brands fa-linkedin-in"></i></a>
                    <a href="https://github.com/SysAdmin-7"><i class="fa-brands fa-github"></i></a>
                </div>
            </div>

            <div class="contact-form-panel">
                <h2>Envoyer un message</h2>
                <form action="https://formspree.io/f/xrbnyanb" method="POST">
                    
                    <div class="input-row">
                        <div class="input-group">
                            <label>Nom</label>
                            <input type="text" name="nom" required>
                        </div>
                        <div class="input-group">
                            <label>Prénom</label>
                            <input type="text" name="prenom" required>
                        </div>
                    </div>

                    <div class="input-group">
                        <label>Email</label>
                        <input type="email" name="email" required>
                    </div>

                    <div class="input-group">
                        <label>Sujet</label>
                        <input type="text" name="sujet" required>
                    </div>

                    <div class="input-group">
                        <label>Message</label>
                        <textarea name="message" rows="4" required></textarea>
                    </div>

                    <button type="submit" class="btn-send">
                        Envoyer <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </form>
            </div>

        </div>
    </div>

    <script src="JS/load-nav.js"></script>
    <script src="JS/script.js"></script>
</body>
</html>
